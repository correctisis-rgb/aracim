<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Konum Paylaşımı — Garaj Defteri</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1115; color: #f2f2f2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px; background: #191c22; border-radius: 16px;
    padding: 28px 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .icon { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 700; }
  .driver-name { color: #ffb020; font-weight: 700; }
  p { color: #b7bcc7; font-size: 14px; line-height: 1.5; margin: 10px 0; }
  .status {
    margin: 18px 0; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: #22262f;
  }
  .status.ok { background: #123321; color: #4ade80; }
  .status.err { background: #331414; color: #f87171; }
  .status.wait { background: #22262f; color: #f2c14e; }
  button {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border: none;
    border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn-start { background: #ffb020; color: #1a1a1a; }
  .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-stop { background: #2a2e37; color: #f2f2f2; }
  .pulse {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  .footer-hint { font-size: 12px; color: #6b7280; margin-top: 18px; }
  .bg-warning {
    margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
    background: #33290f; color: #f2c14e; text-align: left; display: none;
  }
  .bg-warning.show { display: block; }
  .bg-warning strong { color: #ffd166; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📍</div>
  <h1 id="title">Konum Paylaşımı</h1>
  <p id="intro">Yükleniyor…</p>
  <div id="statusBox" class="status wait" style="display:none"></div>
  <button id="startBtn" class="btn-start" style="display:none">Paylaşımı Başlat</button>
  <button id="stopBtn" class="btn-stop" style="display:none">Paylaşımı Durdur</button>
  <div id="bgWarning" class="bg-warning"></div>
  <p class="footer-hint">Bu sayfa "Garaj Defteri" uygulamasına aittir. Konumun sadece seni bu linkle davet eden hane tarafından görülür.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCcfODFLDPVA4zr7L6xKPjEA6-Vle3XPio",
    authDomain: "garaj-defteri-2bcdd.firebaseapp.com",
    projectId: "garaj-defteri-2bcdd",
    storageBucket: "garaj-defteri-2bcdd.firebasestorage.app",
    messagingSenderId: "983721667235",
    appId: "1:983721667235:web:6e47457841795e700ded16"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var titleEl = document.getElementById("title");
  var introEl = document.getElementById("intro");
  var statusBox = document.getElementById("statusBox");
  var startBtn = document.getElementById("startBtn");
  var stopBtn = document.getElementById("stopBtn");
  var bgWarningEl = document.getElementById("bgWarning");

  function setStatus(text, cls) {
    statusBox.style.display = "block";
    statusBox.className = "status " + (cls || "wait");
    statusBox.innerHTML = text;
  }

  // ---------- Ekranı uyanık tutma (Wake Lock) ----------
  // Telefon ekranı otomatik kilitlenirse (bir süre dokunulmazsa) tarayıcı
  // sekmeyi arka plana atar ve konum güncellemeleri durur. Wake Lock API,
  // bu OTOMATİK kilitlenmeyi engeller — ekran açık kaldığı sürece paylaşım
  // kesintisiz devam eder. ANCAK: kullanıcı telefonun kilit/güç düğmesine
  // ELLE basarsa ya da başka bir uygulamaya tamamen geçerse (App Switcher),
  // Wake Lock bunu engelleyemez; bu durumda tarayıcı (özellikle iOS
  // Safari'de) sekmeyi neredeyse anında durdurur — bu, tarayıcının kendi
  // pil/güvenlik kısıtlamasıdır, kodla aşılamaz. Bu yüzden kullanıcıya
  // aşağıda net bir uyarı gösteriyoruz.
  var wakeLock = null;
  var wakeLockSupported = "wakeLock" in navigator;
  var sharingActive = false;

  function requestWakeLock() {
    if (!wakeLockSupported || !sharingActive) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      wakeLock.addEventListener("release", function () {
        wakeLock = null;
      });
    }).catch(function (err) {
      // Bazı tarayıcılar (ör. düşük pil modu) reddedebilir; sessizce yut,
      // paylaşım yine de devam eder (sadece ekran otomatik kilitlenebilir).
      console.warn("Wake Lock alınamadı:", err);
    });
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function updateBgWarning() {
    if (!sharingActive) { bgWarningEl.className = "bg-warning"; return; }
    if (!wakeLockSupported) {
      bgWarningEl.innerHTML = "⚠️ <strong>Bu tarayıcı ekranı otomatik açık tutmayı desteklemiyor.</strong> Kesintisiz konum paylaşımı için ekranı elle açık tut ve bu sekmeden çıkma.";
      bgWarningEl.className = "bg-warning show";
    } else {
      bgWarningEl.innerHTML = "ℹ️ Ekranın kilitlenmesini engelledik, konum arka planda da gönderilmeye devam edecek. <strong>Ancak</strong> telefonu elle kilitlersen ya da tamamen başka bir uygulamaya geçersen, tarayıcı konum göndermeyi durdurabilir — en sağlıklısı bu sekmeyi/ekranı açık tutmak.";
      bgWarningEl.className = "bg-warning show";
    }
  }

  // Sekme görünürlüğü değiştiğinde: (a) tekrar öne geldiğinde Wake Lock'u
  // yeniden iste (tarayıcılar sekme arka plana alınınca kilidi otomatik
  // serbest bırakır) ve taze bir konum gönder; (b) arka plana alındığında
  // kullanıcıyı bilgilendir.
  document.addEventListener("visibilitychange", function () {
    if (!sharingActive) return;
    if (document.visibilityState === "visible") {
      requestWakeLock();
      setStatus('<span class="pulse"></span>Konum paylaşılıyor…', "ok");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(onPosition, function () {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
      }
    } else {
      setStatus("⏸️ Sekme arka planda — tarayıcı izin verdiği sürece göndermeye devam ediyor.", "wait");
    }
  });

  function getShareId() {
    var params = new URLSearchParams(window.location.search);
    return params.get("id");
  }

  var shareId = getShareId();
  var watchId = null;
  var docRef = null;
  var wasStopped = false; // duruyor/gidiyor geçişini tespit etmek için

  if (!shareId) {
    titleEl.textContent = "Geçersiz Link";
    introEl.textContent = "Bu link eksik veya hatalı görünüyor. Lütfen size gönderilen linki tekrar kontrol edin.";
  } else {
    docRef = db.collection("driverLocations").doc(shareId);
    init();
  }

  function init() {
    // ÖNEMLİ: Burada artık signInAnonymously() ÇAĞRILMIYOR. Eskiden bu
    // fonksiyon sayfa yüklenir yüklenmez (kullanıcı "Paylaşımı Başlat"a
    // basmadan ÖNCE) anonim bir Firebase Auth hesabı oluşturuyordu — yani
    // linki sadece açıp hiçbir şey yapmayan herkes (ve linke uğrayan
    // botlar/tarayıcı önizleyicileri) için bile boş bir anonim kullanıcı
    // kaydı oluşuyordu. Firebase Console > Authentication'da birikip duran
    // çok sayıda "(anonymous)" kullanıcının asıl sebebi buydu.
    //
    // Firestore kuralları driverLocations için okumayı da (request.auth
    // != null) auth şartına bağladığından, "revoked" kontrolünü artık
    // burada PEŞİNEN yapamıyoruz — bunun yerine kullanıcı gerçekten
    // paylaşımı başlatmak için düğmeye bastığında startSharing() içinde
    // hem anonim girişi yapıyor hem de revoked kontrolünü orada
    // gerçekleştiriyoruz. Böylece sadece gerçekten paylaşım başlatan
    // kullanıcılar için anonim hesap oluşuyor.
    introEl.innerHTML = "Konumunu paylaşmak için aşağıdaki düğmeye bas. Konumun sadece seni davet eden kişi tarafından görülebilir.";
    startBtn.style.display = "block";
    startBtn.addEventListener("click", startSharing);
    stopBtn.addEventListener("click", stopSharing);
  }

  function startSharing() {
    if (!navigator.geolocation) {
      setStatus("Bu tarayıcı konum paylaşımını desteklemiyor.", "err");
      return;
    }
    startBtn.disabled = true;
    setStatus("Bağlanılıyor…", "wait");

    // Anonim giriş ve "revoked" kontrolü artık BURADA (kullanıcı gerçekten
    // paylaşımı başlatmak istediğinde) yapılıyor — bkz. init() içindeki not.
    auth.signInAnonymously().then(function () {
      return docRef.get();
    }).then(function (snap) {
      // NOT: snap.exists === false, bu shareId'nin HİÇ kullanılmamış (yeni
      // oluşturulmuş) bir link olduğu anlamına gelir — bu normaldir, çünkü
      // driverLocations/{shareId} dokümanı ancak ilk konum onPosition()
      // içinde yazıldığında oluşturulur. Bu yüzden "geçersiz link" durumu
      // SADECE doküman VAR ve revoked:true ise geçerlidir; doküman
      // yokluğu tek başına geçersizlik anlamına gelmez.
      if (snap.exists && snap.data().revoked === true) {
        startBtn.disabled = false;
        startBtn.style.display = "none";
        titleEl.textContent = "Paylaşım Linki Geçersiz";
        introEl.textContent = "Bu paylaşım linki artık aktif değil. Yeni bir link almak için hane sahibinle iletişime geç.";
        return;
      }
      beginGeolocationSharing();
    }).catch(function (err) {
      console.error(err);
      startBtn.disabled = false;
      setStatus("Sunucuya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dene.", "err");
    });
  }

  function beginGeolocationSharing() {
    setStatus("Konum izni isteniyor…", "wait");
    sharingActive = true;
    wasStopped = false;
    // Wake Lock isteği kullanıcı tıklamasından (gesture) doğan zincirin
    // içinde kaldığı için burada güvenle yapılabilir.
    requestWakeLock();
    updateBgWarning();

    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 20000
    });
  }

  function onPosition(pos) {
    startBtn.style.display = "none";
    stopBtn.style.display = "block";
    if (document.visibilityState === "visible") {
      setStatus('<span class="pulse"></span>Konum paylaşılıyor…', "ok");
    }
    updateBgWarning();

    // ---------- Duruyor / gidiyor tespiti ----------
    // ÖNEMLİ DÜZELTME: pos.coords.speed tarayıcıda/telefonda ÇOK SIK null
    // gelir (özellikle GPS sinyali zayıfken, ilk birkaç ping'de, ya da bazı
    // Android/iOS tarayıcılarında hiç desteklenmez) — eski kod null'u da
    // "hız 0, yani duruyor" sayıyordu. Bu da aracın FİİLEN HAREKET
    // HALİNDEYKEN bile sürekli "duruyor" görünmesine, dolayısıyla her
    // GPS ping'inde bir yolculuğun kapanıp hemen yenisinin açılmasına
    // (ekranda "12:40-12:40, 0 km" gibi onlarca sahte yolculuk) yol
    // açıyordu. Düzeltme: GPS hız değeri yoksa/null ise, ardışık iki konum
    // arasındaki mesafe/süreden bir "yedek hız" hesaplıyoruz.
    var nowMs = Date.now();
    var gpsSpeedKmh = (typeof pos.coords.speed === "number" && !isNaN(pos.coords.speed))
      ? Math.round(Math.max(0, pos.coords.speed) * 3.6)
      : null;
    var fallbackSpeedKmh = null;
    if (lastSpeedFix) {
      var dtMs = nowMs - lastSpeedFix.tMs;
      // Çok kısa aralıklarda mesafe/süre hesabı GPS gürültüsünden aşırı
      // dalgalanır; en az 3 sn beklenmeden yedek hız hesaplanmıyor.
      var accOk = (!pos.coords.accuracy || pos.coords.accuracy <= 60) &&
        (!lastSpeedFix.accuracy || lastSpeedFix.accuracy <= 60);
      if (dtMs >= 3000 && accOk) {
        var distKm = haversineKm(lastSpeedFix.lat, lastSpeedFix.lng, pos.coords.latitude, pos.coords.longitude);
        fallbackSpeedKmh = Math.round(distKm / (dtMs / 3600000));
      }
    }
    lastSpeedFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, tMs: nowMs, accuracy: pos.coords.accuracy || null };

    // GPS'in kendi hız değeri varsa ona güveniyoruz; yoksa yedek (mesafe
    // bazlı) hıza, o da hesaplanamadıysa (ör. ilk ping) 0'a düşüyoruz.
    var speedKmh = gpsSpeedKmh !== null ? gpsSpeedKmh : (fallbackSpeedKmh !== null ? fallbackSpeedKmh : 0);
    var isStopped = speedKmh < 5;

    var patch = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      speed: speedKmh / 3.6,
      speedKmh: speedKmh,
      moving: !isStopped,
      heading: pos.coords.heading || null,
      accuracy: pos.coords.accuracy || null,
      active: true,
      revoked: false,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (isStopped && !wasStopped) {
      patch.stoppedSince = firebase.firestore.FieldValue.serverTimestamp();
    } else if (!isStopped) {
      patch.stoppedSince = firebase.firestore.FieldValue.delete();
    }
    wasStopped = isStopped;

    docRef.set(patch, { merge: true }).catch(function (err) { console.error("konum yazma hatası", err); });

    // ---------- Rota / geçmiş kaydı (trip) ----------
    // Her tekil GPS pingini kaydetmiyoruz — bu, eski fotoğraf sorunundaki
    // gibi belge şişmesine yol açardı. Bunun yerine, hareket eden her
    // "yolculuk parçasını" (durmadan harekete geçişten, tekrar durmaya
    // kadar) ayrı ve küçük bir dokümanda topluyoruz. Duruşları ayrıca
    // kaydetmiyoruz; iki yolculuk arasındaki boşluk zaten "durmuş" demek —
    // rapor tarafı bunu iki trip'in zaman farkından hesaplıyor.
    //
    // DÜZELTME: kısa süreli duruşlar (trafik ışığı, kavşak, GPS gürültüsü)
    // artık yolculuğu HEMEN sonlandırmıyor. "isStopped" true olduğu ANDAN
    // itibaren bir bekleme (STOP_CONFIRM_MS) başlatılıyor; bu süre boyunca
    // hareket tekrar algılanırsa yolculuk hiç bölünmeden devam ediyor. Süre
    // dolmadan hareket başlarsa "dur-kalk" tek bir rota/yolculuk olarak
    // kaydedilmiş olur. Süre dolarsa yolculuk gerçekten sonlanır.
    if (isStopped) {
      if (stopSince === null) stopSince = nowMs;
      if (currentTripRef && (nowMs - stopSince) >= STOP_CONFIRM_MS) {
        endCurrentTrip();
      }
    } else {
      stopSince = null;
      if (!currentTripRef) startNewTrip(pos.coords.latitude, pos.coords.longitude);
      else updateCurrentTrip(pos.coords.latitude, pos.coords.longitude, speedKmh);
    }
  }

  // ---------- Trip (yolculuk parçası) yardımcıları ----------
  var currentTripRef = null;
  var currentTripPath = [];        // [{lat,lng}] — seyreltilmiş rota noktaları
  var currentTripStartedAtMs = 0;  // yerel süre/hız hesapları için (sunucu değil)
  var currentTripDistanceKm = 0;
  var currentTripMaxSpeedKmh = 0;
  var lastRecordedPoint = null;    // {lat,lng,tMs} — rota noktası seyreltme için
  var lastSpeedFix = null;         // {lat,lng,tMs,accuracy} — yedek hız hesabı için (trip'ten bağımsız)
  var stopSince = null;            // şu anki kesintisiz "duruyor" döneminin başlangıcı (yerel, ms)
  var STOP_CONFIRM_MS = 90000;     // 90 sn kesintisiz durmadan yolculuk sonlandırılmaz (kısa duraklamalar rotayı bölmesin)
  var TRIP_POINT_MIN_INTERVAL_MS = 20000; // en az 20 sn'de bir nokta
  var TRIP_POINT_MIN_DISTANCE_KM = 0.025; // veya en az 25 m hareket ettiyse
  var TRIP_MAX_POINTS = 500; // çok uzun yolculuklarda doküman şişmesin diye seyreltilir

  function haversineKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function startNewTrip(lat, lng) {
    currentTripRef = docRef.collection("trips").doc();
    currentTripStartedAtMs = Date.now();
    currentTripPath = [{ lat: lat, lng: lng }];
    currentTripDistanceKm = 0;
    currentTripMaxSpeedKmh = 0;
    lastRecordedPoint = { lat: lat, lng: lng, tMs: currentTripStartedAtMs };
    currentTripRef.set({
      startedAt: firebase.firestore.FieldValue.serverTimestamp(),
      endedAt: firebase.firestore.FieldValue.serverTimestamp(),
      distanceKm: 0,
      avgSpeedKmh: 0,
      maxSpeedKmh: 0,
      path: currentTripPath
    }).catch(function (err) { console.error("trip başlatma hatası", err); });
  }

  function updateCurrentTrip(lat, lng, speedKmh) {
    if (!currentTripRef) return;
    var now = Date.now();
    if (speedKmh > currentTripMaxSpeedKmh) currentTripMaxSpeedKmh = speedKmh;
    var shouldRecordPoint = !lastRecordedPoint ||
      (now - lastRecordedPoint.tMs >= TRIP_POINT_MIN_INTERVAL_MS) ||
      (haversineKm(lastRecordedPoint.lat, lastRecordedPoint.lng, lat, lng) >= TRIP_POINT_MIN_DISTANCE_KM);
    if (!shouldRecordPoint) return;

    if (lastRecordedPoint) {
      currentTripDistanceKm += haversineKm(lastRecordedPoint.lat, lastRecordedPoint.lng, lat, lng);
    }
    currentTripPath.push({ lat: lat, lng: lng });
    if (currentTripPath.length > TRIP_MAX_POINTS) {
      var thinned = [];
      for (var i = 0; i < currentTripPath.length; i += 2) thinned.push(currentTripPath[i]);
      currentTripPath = thinned;
    }
    lastRecordedPoint = { lat: lat, lng: lng, tMs: now };

    var durationHr = Math.max((now - currentTripStartedAtMs) / 3600000, 1 / 3600);
    var avgSpeedKmh = Math.round(currentTripDistanceKm / durationHr);
    currentTripRef.set({
      endedAt: firebase.firestore.FieldValue.serverTimestamp(),
      distanceKm: Math.round(currentTripDistanceKm * 100) / 100,
      avgSpeedKmh: avgSpeedKmh,
      maxSpeedKmh: currentTripMaxSpeedKmh,
      path: currentTripPath
    }, { merge: true }).catch(function (err) { console.error("trip güncelleme hatası", err); });
  }

  function endCurrentTrip() {
    if (!currentTripRef) return;
    var ref = currentTripRef;
    // Hiç ikinci bir nokta kaydedilmemiş (gerçek hareket doğrulanmamış)
    // ya da mesafesi ölçüm hatası düzeyinde (<50 m) bir "yolculuk" ise,
    // bu gerçek bir sefer değil, GPS gürültüsünün ürünüdür — rapor
    // ekranında "0 km, 0 dk" gibi anlamsız satırlar olarak görünmemesi
    // için kaydetmeden siliyoruz.
    var isPhantomTrip = currentTripPath.length < 2 || currentTripDistanceKm < 0.05;
    if (isPhantomTrip) {
      ref.delete().catch(function () {});
    } else {
      ref.set({ endedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(function () {});
    }
    currentTripRef = null;
    currentTripPath = [];
    currentTripDistanceKm = 0;
    currentTripMaxSpeedKmh = 0;
    lastRecordedPoint = null;
    stopSince = null;
  }

  function onPositionError(err) {
    console.error(err);
    startBtn.disabled = false;
    if (err.code === err.PERMISSION_DENIED) {
      setStatus("Konum izni reddedildi. Paylaşabilmek için tarayıcı ayarlarından konum iznini açman gerekiyor.", "err");
    } else {
      setStatus("Konum alınamadı. Lütfen tekrar dene.", "err");
    }
  }

  function stopSharing() {
    sharingActive = false;
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    endCurrentTrip();
    releaseWakeLock();
    updateBgWarning();
    docRef.set({ active: false }, { merge: true }).catch(function () {});
    stopBtn.style.display = "none";
    startBtn.style.display = "block";
    startBtn.disabled = false;
    setStatus("Paylaşım durduruldu.", "wait");
  }

  // NOT: Daha önce burada "beforeunload" (sekme/tarayıcı kapanırken)
  // active:false yazan bir dinleyici vardı. Bu KALDIRILDI — çünkü mobil
  // tarayıcılarda bu olay, şoför sadece uygulamayı değiştirdiğinde veya
  // telefonu kilitlediğinde de tetiklenebiliyor; bu da paylaşımı hiç
