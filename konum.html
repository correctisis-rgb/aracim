<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Konum Paylaşımı — Garaj Defteri</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1115; color: #f2f2f2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 420px; background: #191c22; border-radius: 16px;
    padding: 28px 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .icon { font-size: 48px; margin-bottom: 8px; }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 700; }
  .driver-name { color: #ffb020; font-weight: 700; }
  p { color: #b7bcc7; font-size: 14px; line-height: 1.5; margin: 10px 0; }
  .status {
    margin: 18px 0; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: #22262f;
  }
  .status.ok { background: #123321; color: #4ade80; }
  .status.err { background: #331414; color: #f87171; }
  .status.wait { background: #22262f; color: #f2c14e; }
  button {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 700; border: none;
    border-radius: 10px; cursor: pointer; margin-top: 10px;
  }
  .btn-start { background: #ffb020; color: #1a1a1a; }
  .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-stop { background: #2a2e37; color: #f2f2f2; }
  .pulse {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  .footer-hint { font-size: 12px; color: #6b7280; margin-top: 18px; }
  .bg-warning {
    margin-top: 14px; padding: 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
    background: #33290f; color: #f2c14e; text-align: left; display: none;
  }
  .bg-warning.show { display: block; }
  .bg-warning strong { color: #ffd166; }
  .stats-box { display: none; margin-top: 14px; }
  .stats-box.show { display: block; }
  .speed-hero {
    background: #22262f; border-radius: 14px; padding: 18px 10px; margin-bottom: 10px;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .speed-hero-value {
    font-size: 46px; font-weight: 800; line-height: 1; color: #f2f2f2;
    font-variant-numeric: tabular-nums; transition: color 0.25s ease;
  }
  .speed-hero-unit { font-size: 12px; color: #8b909c; margin-top: 5px; letter-spacing: 0.05em; text-transform: uppercase; }
  .speed-hero.stopped .speed-hero-value { color: #8b909c; }
  .speed-hero.over-limit { background: #331414; box-shadow: 0 0 0 2px #f87171 inset; }
  .speed-hero.over-limit .speed-hero-value { color: #f87171; }
  .road-info {
    background: #1b2530; border-radius: 10px; padding: 10px 13px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left;
  }
  .road-info-name {
    font-size: 12.5px; color: #c7cbd4; font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .road-info-limit { font-size: 13px; font-weight: 800; color: #ffb020; white-space: nowrap; flex-shrink: 0; }
  .road-info-limit.over { color: #f87171; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stats-item { background: #22262f; border-radius: 10px; padding: 13px 6px; }
  .stats-value { font-size: 21px; font-weight: 700; color: #f2f2f2; }
  .stats-label { font-size: 11px; color: #8b909c; margin-top: 3px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📍</div>
  <h1 id="title">Konum Paylaşımı</h1>
  <p id="intro">Yükleniyor…</p>
  <div id="statusBox" class="status wait" style="display:none"></div>
  <div id="statsBox" class="stats-box">
    <div class="speed-hero" id="speedHero">
      <div class="speed-hero-value" id="statSpeed">0</div>
      <div class="speed-hero-unit">km/s</div>
    </div>
    <div class="road-info" id="roadInfo">
      <div class="road-info-name" id="statRoadName">Yol bilgisi aranıyor…</div>
      <div class="road-info-limit" id="statRoadLimit"></div>
    </div>
    <div class="stats-grid">
      <div class="stats-item"><div class="stats-value" id="statDistance">0</div><div class="stats-label">km (bugün)</div></div>
      <div class="stats-item"><div class="stats-value" id="statDuration">0 dk</div><div class="stats-label">paylaşım süresi</div></div>
    </div>
  </div>
  <button id="startBtn" class="btn-start" style="display:none">Paylaşımı Başlat</button>
  <button id="stopBtn" class="btn-stop" style="display:none">Paylaşımı Durdur</button>
  <div id="bgWarning" class="bg-warning"></div>
  <p class="footer-hint">Bu sayfa "Garaj Defteri" uygulamasına aittir. Konumun sadece seni bu linkle davet eden hane tarafından görülür.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCcfODFLDPVA4zr7L6xKPjEA6-Vle3XPio",
    authDomain: "garaj-defteri-2bcdd.firebaseapp.com",
    projectId: "garaj-defteri-2bcdd",
    storageBucket: "garaj-defteri-2bcdd.firebasestorage.app",
    messagingSenderId: "983721667235",
    appId: "1:983721667235:web:6e47457841795e700ded16"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var titleEl = document.getElementById("title");
  var introEl = document.getElementById("intro");
  var statusBox = document.getElementById("statusBox");
  var startBtn = document.getElementById("startBtn");
  var stopBtn = document.getElementById("stopBtn");
  var bgWarningEl = document.getElementById("bgWarning");
  var statsBox = document.getElementById("statsBox");
  var speedHeroEl = document.getElementById("speedHero");
  var statSpeedEl = document.getElementById("statSpeed");
  var statDistanceEl = document.getElementById("statDistance");
  var statDurationEl = document.getElementById("statDuration");
  var roadNameEl = document.getElementById("statRoadName");
  var roadLimitEl = document.getElementById("statRoadLimit");

  // "Bugün kaç km" — currentTripDistanceKm'den FARKLI olarak, araç her
  // durup 90 sn sonra yeni bir trip başladığında SIFIRLANMIYOR; bu
  // paylaşımın açık olduğu süre boyunca (durma molaları dahil) toplam
  // kat edilen mesafeyi gösterir. Sayfa yeniden açılırsa (örn. tarayıcı
  // sekmesi kapanıp tekrar açıldıysa) 0'dan başlar — bu bilerek böyle,
  // "bugünün toplamı" için harita tarafındaki "📅 Bugün: X km" zaten
  // Firestore'daki trip kayıtlarından hesaplanıyor, bu sayaç sadece şu
  // anki paylaşım oturumu için hızlı bir görsel geri bildirim.
  var sessionDistanceKm = 0;
  var sessionStartMs = null;
  var durationTimerId = null;

  function formatDurationTR(ms) {
    var totalMin = Math.floor(ms / 60000);
    if (totalMin < 60) return totalMin + " dk";
    var h = Math.floor(totalMin / 60), m = totalMin % 60;
    return h + " sa " + m + " dk";
  }

  // ---------- Yol adı / hız limiti (OpenStreetMap Overpass API) ----------
  // Şoförün o an üzerinde olduğu yola en yakın OSM yolunu bulup varsa
  // "maxspeed" etiketini gösteriyoruz. Bu tamamen "iyi çaba" (best-effort)
  // bir özellik: OSM'de her yolun hız limiti etiketlenmiş olmayabilir, ve
  // Overpass sunucusuna erişilemezse (yavaş internet, ücretsiz servis
  // limiti vb.) sessizce eski bilgiyi göstermeye devam ederiz — hata
  // kullanıcıyı rahatsız etmez.
  var ROAD_QUERY_MIN_INTERVAL_MS = 25000; // aynı yerde en fazla ~25 sn'de bir sorgula
  var ROAD_QUERY_MIN_MOVE_KM = 0.12;      // ya da 120 m'den fazla hareket ettiyse
  var ROAD_QUERY_RADIUS_M = 35;
  var lastRoadQueryPoint = null; // {lat,lng,tMs}
  var roadQueryInFlight = false;
  var lastRoadInfo = null; // {name, maxspeedKmh} | null

  // TR:urban / TR:rural / TR:motorway gibi OSM "örtük" (implicit) hız
  // limiti etiketleri Türkiye trafik yönetmeliğindeki genel varsayılan
  // limitlerdir; sayısal bir "maxspeed" etiketi varsa o zaten önceliklidir.
  var TR_IMPLICIT_MAXSPEED = { "TR:urban": 50, "TR:rural": 90, "TR:motorway": 120, "TR:living_street": 20 };
  var HIGHWAY_LABEL_TR = {
    motorway: "Otoyol", trunk: "Devlet Yolu", primary: "Ana Yol", secondary: "İkincil Yol",
    tertiary: "Yerel Yol", residential: "Mahalle Yolu", living_street: "Yaya Öncelikli Yol",
    unclassified: "Yol", service: "Servis Yolu", trunk_link: "Devlet Yolu Bağlantısı",
    primary_link: "Ana Yol Bağlantısı", motorway_link: "Otoyol Bağlantısı"
  };

  function parseMaxSpeedTag(val) {
    if (!val) return null;
    val = String(val).trim();
    if (/^\d+$/.test(val)) return parseInt(val, 10);
    var mphMatch = val.match(/^(\d+)\s*mph$/i);
    if (mphMatch) return Math.round(parseInt(mphMatch[1], 10) * 1.60934);
    if (TR_IMPLICIT_MAXSPEED[val] != null) return TR_IMPLICIT_MAXSPEED[val];
    return null;
  }

  function updateRoadUI(info) {
    if (!info) {
      roadNameEl.textContent = "Yol bilgisi bulunamadı";
      roadLimitEl.textContent = "";
      roadLimitEl.className = "road-info-limit";
      return;
    }
    roadNameEl.textContent = info.name;
    if (info.maxspeedKmh) {
      roadLimitEl.textContent = "Limit: " + info.maxspeedKmh + " km/s";
    } else {
      roadLimitEl.textContent = "Limit bilinmiyor";
    }
    roadLimitEl.className = "road-info-limit";
  }

  function fetchNearestRoadInfo(lat, lng) {
    var query = "[out:json][timeout:10];way(around:" + ROAD_QUERY_RADIUS_M + "," + lat + "," + lng + ")[highway];out tags geom;";
    var url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("overpass yanıt hatası");
      return r.json();
    }).then(function (data) {
      var elements = (data && data.elements) || [];
      if (!elements.length) return null;
      var best = null, bestDistKm = Infinity;
      elements.forEach(function (el) {
        if (!el.geometry) return;
        el.geometry.forEach(function (pt) {
          if (typeof pt.lat !== "number" || typeof pt.lon !== "number") return;
          var d = haversineKm(lat, lng, pt.lat, pt.lon);
          if (d < bestDistKm) { bestDistKm = d; best = el; }
        });
      });
      if (!best) return null;
      var tags = best.tags || {};
      var name = tags.name || tags.ref || (HIGHWAY_LABEL_TR[tags.highway] || "Yol");
      var maxspeedKmh = parseMaxSpeedTag(tags.maxspeed);
      return { name: name, maxspeedKmh: maxspeedKmh };
    });
  }

  function maybeQueryRoadInfo(lat, lng) {
    var nowMs = Date.now();
    if (roadQueryInFlight) return;
    if (lastRoadQueryPoint) {
      var movedKm = haversineKm(lastRoadQueryPoint.lat, lastRoadQueryPoint.lng, lat, lng);
      var elapsedMs = nowMs - lastRoadQueryPoint.tMs;
      if (elapsedMs < ROAD_QUERY_MIN_INTERVAL_MS && movedKm < ROAD_QUERY_MIN_MOVE_KM) return;
    }
    lastRoadQueryPoint = { lat: lat, lng: lng, tMs: nowMs };
    roadQueryInFlight = true;
    fetchNearestRoadInfo(lat, lng).then(function (info) {
      lastRoadInfo = info;
      updateRoadUI(info);
    }).catch(function (err) {
      // Sessizce yut — ağ hatası ya da Overpass'a erişilemedi; eski bilgi
      // (varsa) ekranda kalmaya devam eder, kullanıcıyı hata ile rahatsız
      // etmiyoruz.
      console.warn("yol/hız limiti sorgusu başarısız:", err);
    }).then(function () { roadQueryInFlight = false; });
  }

  function updateStatsUI(speedKmh) {
    statsBox.classList.add("show");
    var spd = (typeof speedKmh === "number" ? speedKmh : 0);
    statSpeedEl.textContent = spd;
    statDistanceEl.textContent = Math.round(sessionDistanceKm * 10) / 10;
    if (sessionStartMs) statDurationEl.textContent = formatDurationTR(Date.now() - sessionStartMs);

    // Hız kutusunu duruma göre renklendiriyoruz: duruyorken soluk gri,
    // bilinen bir hız limiti aşılmışsa (5 km/s tolerans ile) kırmızı uyarı.
    var limit = lastRoadInfo && lastRoadInfo.maxspeedKmh;
    var overLimit = typeof limit === "number" && spd > limit + 5;
    speedHeroEl.classList.toggle("stopped", spd < 5);
    speedHeroEl.classList.toggle("over-limit", overLimit);
    if (roadLimitEl.textContent) {
      roadLimitEl.classList.toggle("over", overLimit);
    }
  }

  function setStatus(text, cls) {
    statusBox.style.display = "block";
    statusBox.className = "status " + (cls || "wait");
    statusBox.innerHTML = text;
  }

  // ---------- Ekranı uyanık tutma (Wake Lock) ----------
  // Telefon ekranı otomatik kilitlenirse (bir süre dokunulmazsa) tarayıcı
  // sekmeyi arka plana atar ve konum güncellemeleri durur. Wake Lock API,
  // bu OTOMATİK kilitlenmeyi engeller — ekran açık kaldığı sürece paylaşım
  // kesintisiz devam eder. ANCAK: kullanıcı telefonun kilit/güç düğmesine
  // ELLE basarsa ya da başka bir uygulamaya tamamen geçerse (App Switcher),
  // Wake Lock bunu engelleyemez; bu durumda tarayıcı (özellikle iOS
  // Safari'de) sekmeyi neredeyse anında durdurur — bu, tarayıcının kendi
  // pil/güvenlik kısıtlamasıdır, kodla aşılamaz. Bu yüzden kullanıcıya
  // aşağıda net bir uyarı gösteriyoruz.
  var wakeLock = null;
  var wakeLockSupported = "wakeLock" in navigator;
  var sharingActive = false;

  function requestWakeLock() {
    if (!wakeLockSupported || !sharingActive) return;
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      wakeLock.addEventListener("release", function () {
        wakeLock = null;
      });
    }).catch(function (err) {
      // Bazı tarayıcılar (ör. düşük pil modu) reddedebilir; sessizce yut,
      // paylaşım yine de devam eder (sadece ekran otomatik kilitlenebilir).
      console.warn("Wake Lock alınamadı:", err);
    });
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  function updateBgWarning() {
    if (!sharingActive) { bgWarningEl.className = "bg-warning"; return; }
    if (!wakeLockSupported) {
      bgWarningEl.innerHTML = "⚠️ <strong>Bu tarayıcı ekranı otomatik açık tutmayı desteklemiyor.</strong> Kesintisiz konum paylaşımı için ekranı elle açık tut ve bu sekmeden çıkma.";
      bgWarningEl.className = "bg-warning show";
    } else {
      bgWarningEl.innerHTML = "ℹ️ Ekranın kilitlenmesini engelledik, konum arka planda da gönderilmeye devam edecek. <strong>Ancak</strong> telefonu elle kilitlersen ya da tamamen başka bir uygulamaya geçersen, tarayıcı konum göndermeyi durdurabilir — en sağlıklısı bu sekmeyi/ekranı açık tutmak.";
      bgWarningEl.className = "bg-warning show";
    }
  }

  // Sekme görünürlüğü değiştiğinde: (a) tekrar öne geldiğinde Wake Lock'u
  // yeniden iste (tarayıcılar sekme arka plana alınınca kilidi otomatik
  // serbest bırakır) ve taze bir konum gönder; (b) arka plana alındığında
  // kullanıcıyı bilgilendir.
  document.addEventListener("visibilitychange", function () {
    if (!sharingActive) return;
    if (document.visibilityState === "visible") {
      requestWakeLock();
      setStatus('<span class="pulse"></span>Konum paylaşılıyor…', "ok");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(onPosition, function () {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
      }
    } else {
      setStatus("⏸️ Sekme arka planda — tarayıcı izin verdiği sürece göndermeye devam ediyor.", "wait");
    }
  });

  function getShareId() {
    var params = new URLSearchParams(window.location.search);
    return params.get("id");
  }

  var shareId = getShareId();
  var watchId = null;
  var docRef = null;
  var wasStopped = false; // duruyor/gidiyor geçişini tespit etmek için

  if (!shareId) {
    titleEl.textContent = "Geçersiz Link";
    introEl.textContent = "Bu link eksik veya hatalı görünüyor. Lütfen size gönderilen linki tekrar kontrol edin.";
  } else {
    docRef = db.collection("driverLocations").doc(shareId);
    init();
  }

  function init() {
    // ÖNEMLİ: Burada artık signInAnonymously() ÇAĞRILMIYOR. Eskiden bu
    // fonksiyon sayfa yüklenir yüklenmez (kullanıcı "Paylaşımı Başlat"a
    // basmadan ÖNCE) anonim bir Firebase Auth hesabı oluşturuyordu — yani
    // linki sadece açıp hiçbir şey yapmayan herkes (ve linke uğrayan
    // botlar/tarayıcı önizleyicileri) için bile boş bir anonim kullanıcı
    // kaydı oluşuyordu. Firebase Console > Authentication'da birikip duran
    // çok sayıda "(anonymous)" kullanıcının asıl sebebi buydu.
    //
    // Firestore kuralları driverLocations için okumayı da (request.auth
    // != null) auth şartına bağladığından, "revoked" kontrolünü artık
    // burada PEŞİNEN yapamıyoruz — bunun yerine kullanıcı gerçekten
    // paylaşımı başlatmak için düğmeye bastığında startSharing() içinde
    // hem anonim girişi yapıyor hem de revoked kontrolünü orada
    // gerçekleştiriyoruz. Böylece sadece gerçekten paylaşım başlatan
    // kullanıcılar için anonim hesap oluşuyor.
    introEl.innerHTML = "Konumunu paylaşmak için aşağıdaki düğmeye bas. Konumun sadece seni davet eden kişi tarafından görülebilir.";
    startBtn.style.display = "block";
    startBtn.addEventListener("click", startSharing);
    stopBtn.addEventListener("click", stopSharing);
  }

  function startSharing() {
    if (!navigator.geolocation) {
      setStatus("Bu tarayıcı konum paylaşımını desteklemiyor.", "err");
      return;
    }
    startBtn.disabled = true;
    setStatus("Bağlanılıyor…", "wait");

    // Anonim giriş ve "revoked" kontrolü artık BURADA (kullanıcı gerçekten
    // paylaşımı başlatmak istediğinde) yapılıyor — bkz. init() içindeki not.
    auth.signInAnonymously().then(function () {
      return docRef.get();
    }).then(function (snap) {
      // NOT: snap.exists === false, bu shareId'nin HİÇ kullanılmamış (yeni
      // oluşturulmuş) bir link olduğu anlamına gelir — bu normaldir, çünkü
      // driverLocations/{shareId} dokümanı ancak ilk konum onPosition()
      // içinde yazıldığında oluşturulur. Bu yüzden "geçersiz link" durumu
      // SADECE doküman VAR ve revoked:true ise geçerlidir; doküman
      // yokluğu tek başına geçersizlik anlamına gelmez.
      if (snap.exists && snap.data().revoked === true) {
        startBtn.disabled = false;
        startBtn.style.display = "none";
        titleEl.textContent = "Paylaşım Linki Geçersiz";
        introEl.textContent = "Bu paylaşım linki artık aktif değil. Yeni bir link almak için hane sahibinle iletişime geç.";
        return;
      }
      // driverName varsa (index.html startDriverShare() tarafından
      // yazılıyor): hem anonim Firebase Auth hesabının displayName'ini
      // ayarlıyoruz (Firebase Console'da hangi anonim oturumun hangi
      // şoföre ait olduğunu ayırt etmek için — liste görünümü hâlâ
      // "(anonymous)" yazar ama kullanıcı detayına girince isim görünür),
      // hem de ekrandaki karşılamayı kişiselleştiriyoruz.
      var driverName = snap.exists && snap.data().driverName;
      if (driverName && auth.currentUser) {
        auth.currentUser.updateProfile({ displayName: driverName }).catch(function () {});
      }
      if (driverName) {
        titleEl.textContent = driverName + " — Konum Paylaşımı";
      }
      beginGeolocationSharing();
    }).catch(function (err) {
      console.error(err);
      startBtn.disabled = false;
      setStatus("Sunucuya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dene.", "err");
    });
  }

  function beginGeolocationSharing() {
    setStatus("Konum izni isteniyor…", "wait");
    sharingActive = true;
    wasStopped = false;
    // Wake Lock isteği kullanıcı tıklamasından (gesture) doğan zincirin
    // içinde kaldığı için burada güvenle yapılabilir.
    requestWakeLock();
    updateBgWarning();

    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 20000
    });

    watchForRevoke();

    sessionDistanceKm = 0;
    sessionStartMs = Date.now();
    lastRoadInfo = null;
    lastRoadQueryPoint = null;
    roadNameEl.textContent = "Yol bilgisi aranıyor…";
    roadLimitEl.textContent = "";
    roadLimitEl.className = "road-info-limit";
    if (durationTimerId) clearInterval(durationTimerId);
    durationTimerId = setInterval(function () { if (sessionStartMs) statDurationEl.textContent = formatDurationTR(Date.now() - sessionStartMs); }, 30000);
  }

  // ---------- Hane tarafından uzaktan durdurma (revoked) ----------
  // Hane, "Paylaşımı Durdur" butonuna bastığında (index.html > stopDriverShare)
  // bu dokümana revoked:true yazar. Paylaşım devam ederken bu değişikliği
  // canlı dinleyip yakaladığımızda, tıpkı şoförün kendi "Paylaşımı Durdur"
  // düğmesine basmış gibi stopSharing() çağırıyoruz — bu da yolculuğu kapatıp
  // active:false yazdıktan sonra anonim Firebase Auth hesabını siler. Böylece
  // hane tarafından durdurulan bir paylaşımda da Firebase Console'da
  // "(anonymous)" kullanıcı birikmez.
  var revokeUnsub = null;
  function watchForRevoke() {
    if (revokeUnsub || !docRef) return;
    revokeUnsub = docRef.onSnapshot(function (snap) {
      if (!sharingActive) return;
      if (snap.exists && snap.data().revoked === true) {
        stopSharing(true);
      }
    }, function (err) { console.warn("revoke izleme hatası:", err); });
  }
  function unwatchForRevoke() {
    if (revokeUnsub) { revokeUnsub(); revokeUnsub = null; }
  }

  function onPosition(pos) {
    startBtn.style.display = "none";
    stopBtn.style.display = "block";
    if (document.visibilityState === "visible") {
      setStatus('<span class="pulse"></span>Konum paylaşılıyor…', "ok");
    }
    updateBgWarning();

    // ---------- Duruyor / gidiyor tespiti ----------
    // ÖNEMLİ DÜZELTME: pos.coords.speed tarayıcıda/telefonda ÇOK SIK null
    // gelir (özellikle GPS sinyali zayıfken, ilk birkaç ping'de, ya da bazı
    // Android/iOS tarayıcılarında hiç desteklenmez) — eski kod null'u da
    // "hız 0, yani duruyor" sayıyordu. Bu da aracın FİİLEN HAREKET
    // HALİNDEYKEN bile sürekli "duruyor" görünmesine, dolayısıyla her
    // GPS ping'inde bir yolculuğun kapanıp hemen yenisinin açılmasına
    // (ekranda "12:40-12:40, 0 km" gibi onlarca sahte yolculuk) yol
    // açıyordu. Düzeltme: GPS hız değeri yoksa/null ise, ardışık iki konum
    // arasındaki mesafe/süreden bir "yedek hız" hesaplıyoruz.
    var nowMs = Date.now();
    var prevSpeedFix = lastSpeedFix; // mesafe biriktirmek için ESKİ konumu sakla (aşağıda lastSpeedFix güncellenmeden önce)
    var gpsSpeedKmh = (typeof pos.coords.speed === "number" && !isNaN(pos.coords.speed))
      ? Math.round(Math.max(0, pos.coords.speed) * 3.6)
      : null;
    var fallbackSpeedKmh = null;
    if (lastSpeedFix) {
      var dtMs = nowMs - lastSpeedFix.tMs;
      // Çok kısa aralıklarda mesafe/süre hesabı GPS gürültüsünden aşırı
      // dalgalanır; en az 3 sn beklenmeden yedek hız hesaplanmıyor.
      var accOk = (!pos.coords.accuracy || pos.coords.accuracy <= 60) &&
        (!lastSpeedFix.accuracy || lastSpeedFix.accuracy <= 60);
      if (dtMs >= 3000 && accOk) {
        var distKm = haversineKm(lastSpeedFix.lat, lastSpeedFix.lng, pos.coords.latitude, pos.coords.longitude);
        fallbackSpeedKmh = Math.round(distKm / (dtMs / 3600000));
      }
    }
    lastSpeedFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, tMs: nowMs, accuracy: pos.coords.accuracy || null };

    // GPS'in kendi hız değeri varsa ona güveniyoruz; yoksa yedek (mesafe
    // bazlı) hıza, o da hesaplanamadıysa (ör. ilk ping) 0'a düşüyoruz.
    var speedKmh = gpsSpeedKmh !== null ? gpsSpeedKmh : (fallbackSpeedKmh !== null ? fallbackSpeedKmh : 0);
    var isStopped = speedKmh < 5;

    // ---------- Şoför ekranındaki anlık hız / bugünkü mesafe / süre ----------
    // GPS gürültüsünden (duruyorken bile küçük sapmalar) mesafenin şişmemesi
    // için sadece "duruyor değil" (isStopped=false) ve makul doğrulukta
    // (accuracy<=60m) pinglerde, önceki konumla arasındaki mesafe eklenir.
    if (!isStopped && prevSpeedFix && (!pos.coords.accuracy || pos.coords.accuracy <= 60) && (!prevSpeedFix.accuracy || prevSpeedFix.accuracy <= 60)) {
      sessionDistanceKm += haversineKm(prevSpeedFix.lat, prevSpeedFix.lng, pos.coords.latitude, pos.coords.longitude);
    }
    updateStatsUI(speedKmh);
    maybeQueryRoadInfo(pos.coords.latitude, pos.coords.longitude);

    var patch = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      speed: speedKmh / 3.6,
      speedKmh: speedKmh,
      moving: !isStopped,
      heading: pos.coords.heading || null,
      accuracy: pos.coords.accuracy || null,
      active: true,
      revoked: false,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (isStopped && !wasStopped) {
      patch.stoppedSince = firebase.firestore.FieldValue.serverTimestamp();
    } else if (!isStopped) {
      patch.stoppedSince = firebase.firestore.FieldValue.delete();
    }
    wasStopped = isStopped;

    docRef.set(patch, { merge: true }).catch(function (err) { console.error("konum yazma hatası", err); });

    // ---------- Rota / geçmiş kaydı (trip) ----------
    // Her tekil GPS pingini kaydetmiyoruz — bu, eski fotoğraf sorunundaki
    // gibi belge şişmesine yol açardı. Bunun yerine, hareket eden her
    // "yolculuk parçasını" (durmadan harekete geçişten, tekrar durmaya
    // kadar) ayrı ve küçük bir dokümanda topluyoruz. Duruşları ayrıca
    // kaydetmiyoruz; iki yolculuk arasındaki boşluk zaten "durmuş" demek —
    // rapor tarafı bunu iki trip'in zaman farkından hesaplıyor.
    //
    // DÜZELTME: kısa süreli duruşlar (trafik ışığı, kavşak, GPS gürültüsü)
    // artık yolculuğu HEMEN sonlandırmıyor. "isStopped" true olduğu ANDAN
    // itibaren bir bekleme (STOP_CONFIRM_MS) başlatılıyor; bu süre boyunca
    // hareket tekrar algılanırsa yolculuk hiç bölünmeden devam ediyor. Süre
    // dolmadan hareket başlarsa "dur-kalk" tek bir rota/yolculuk olarak
    // kaydedilmiş olur. Süre dolarsa yolculuk gerçekten sonlanır.
    if (isStopped) {
      if (stopSince === null) stopSince = nowMs;
      if (currentTripRef && (nowMs - stopSince) >= STOP_CONFIRM_MS) {
        endCurrentTrip();
      }
    } else {
      stopSince = null;
      if (!currentTripRef) startNewTrip(pos.coords.latitude, pos.coords.longitude);
      else updateCurrentTrip(pos.coords.latitude, pos.coords.longitude, speedKmh);
    }
  }

  // ---------- Trip (yolculuk parçası) yardımcıları ----------
  var currentTripRef = null;
  var currentTripPath = [];        // [{lat,lng}] — seyreltilmiş rota noktaları
  var currentTripStartedAtMs = 0;  // yerel süre/hız hesapları için (sunucu değil)
  var currentTripDistanceKm = 0;
  var currentTripMaxSpeedKmh = 0;
  var lastRecordedPoint = null;    // {lat,lng,tMs} — rota noktası seyreltme için
  var lastSpeedFix = null;         // {lat,lng,tMs,accuracy} — yedek hız hesabı için (trip'ten bağımsız)
  var stopSince = null;            // şu anki kesintisiz "duruyor" döneminin başlangıcı (yerel, ms)
  var STOP_CONFIRM_MS = 90000;     // 90 sn kesintisiz durmadan yolculuk sonlandırılmaz (kısa duraklamalar rotayı bölmesin)
  var TRIP_POINT_MIN_INTERVAL_MS = 20000; // en az 20 sn'de bir nokta
  var TRIP_POINT_MIN_DISTANCE_KM = 0.025; // veya en az 25 m hareket ettiyse
  var TRIP_MAX_POINTS = 500; // çok uzun yolculuklarda doküman şişmesin diye seyreltilir

  function haversineKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function startNewTrip(lat, lng) {
    currentTripRef = docRef.collection("trips").doc();
    currentTripStartedAtMs = Date.now();
    currentTripPath = [{ lat: lat, lng: lng }];
    currentTripDistanceKm = 0;
    currentTripMaxSpeedKmh = 0;
    lastRecordedPoint = { lat: lat, lng: lng, tMs: currentTripStartedAtMs };
    currentTripRef.set({
      startedAt: firebase.firestore.FieldValue.serverTimestamp(),
      endedAt: firebase.firestore.FieldValue.serverTimestamp(),
      distanceKm: 0,
      avgSpeedKmh: 0,
      maxSpeedKmh: 0,
      path: currentTripPath
    }).catch(function (err) { console.error("trip başlatma hatası", err); });
  }

  function updateCurrentTrip(lat, lng, speedKmh) {
    if (!currentTripRef) return;
    var now = Date.now();
    if (speedKmh > currentTripMaxSpeedKmh) currentTripMaxSpeedKmh = speedKmh;
    var shouldRecordPoint = !lastRecordedPoint ||
      (now - lastRecordedPoint.tMs >= TRIP_POINT_MIN_INTERVAL_MS) ||
      (haversineKm(lastRecordedPoint.lat, lastRecordedPoint.lng, lat, lng) >= TRIP_POINT_MIN_DISTANCE_KM);
    if (!shouldRecordPoint) return;

    if (lastRecordedPoint) {
      currentTripDistanceKm += haversineKm(lastRecordedPoint.lat, lastRecordedPoint.lng, lat, lng);
    }
    currentTripPath.push({ lat: lat, lng: lng });
    if (currentTripPath.length > TRIP_MAX_POINTS) {
      var thinned = [];
      for (var i = 0; i < currentTripPath.length; i += 2) thinned.push(currentTripPath[i]);
      currentTripPath = thinned;
    }
    lastRecordedPoint = { lat: lat, lng: lng, tMs: now };

    var durationHr = Math.max((now - currentTripStartedAtMs) / 3600000, 1 / 3600);
    var avgSpeedKmh = Math.round(currentTripDistanceKm / durationHr);
    currentTripRef.set({
      endedAt: firebase.firestore.FieldValue.serverTimestamp(),
      distanceKm: Math.round(currentTripDistanceKm * 100) / 100,
      avgSpeedKmh: avgSpeedKmh,
      maxSpeedKmh: currentTripMaxSpeedKmh,
      path: currentTripPath
    }, { merge: true }).catch(function (err) { console.error("trip güncelleme hatası", err); });
  }

  function endCurrentTrip() {
    if (!currentTripRef) return Promise.resolve();
    var ref = currentTripRef;
    // Hiç ikinci bir nokta kaydedilmemiş (gerçek hareket doğrulanmamış)
    // ya da mesafesi ölçüm hatası düzeyinde (<50 m) bir "yolculuk" ise,
    // bu gerçek bir sefer değil, GPS gürültüsünün ürünüdür — rapor
    // ekranında "0 km, 0 dk" gibi anlamsız satırlar olarak görünmemesi
    // için kaydetmeden siliyoruz.
    var isPhantomTrip = currentTripPath.length < 2 || currentTripDistanceKm < 0.05;
    // Bu yazmanın Promise'ini döndürüyoruz ki stopSharing() anonim hesabı
    // SİLMEDEN önce bu isteğin sunucuya ulaştığından emin olabilsin —
    // aksi halde auth token silme sırasında geçersiz kalırsa yazma
    // reddedilebilirdi.
    var p = isPhantomTrip
      ? ref.delete().catch(function () {})
      : ref.set({ endedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }).catch(function () {});
    currentTripRef = null;
    currentTripPath = [];
    currentTripDistanceKm = 0;
    currentTripMaxSpeedKmh = 0;
    lastRecordedPoint = null;
    stopSince = null;
    return p;
  }

  function onPositionError(err) {
    console.error(err);
    startBtn.disabled = false;
    if (err.code === err.PERMISSION_DENIED) {
      setStatus("Konum izni reddedildi. Paylaşabilmek için tarayıcı ayarlarından konum iznini açman gerekiyor.", "err");
    } else {
      setStatus("Konum alınamadı. Lütfen tekrar dene.", "err");
    }
  }

  function stopSharing(remote) {
    if (!sharingActive) return; // zaten durdurulmuş (çift tetiklenmeyi önler)
    sharingActive = false;
    unwatchForRevoke();
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    releaseWakeLock();
    updateBgWarning();
    stopBtn.style.display = "none";
    startBtn.style.display = "block";
    startBtn.disabled = false;
    setStatus(remote ? "Paylaşım hane tarafından durduruldu…" : "Paylaşım durduruluyor…", "wait");
    statsBox.classList.remove("show");
    if (durationTimerId) { clearInterval(durationTimerId); durationTimerId = null; }
    sessionStartMs = null;

    var tripDone = endCurrentTrip();
    var activeDone = docRef.set({ active: false }, { merge: true }).catch(function () {});

    // Hem "active:false" hem de açık kalan trip yazması sunucuya
    // ulaştıktan (ya da hatayla sonuçlansa bile) SONRA anonim Firebase
    // Auth hesabını siliyoruz. Bu şoförün oturumu (auth.currentUser)
    // zaten bu anonim hesap olduğu için Admin SDK/backend'e gerek yok —
    // client-side currentUser.delete() yeterli. Böylece "Paylaşımı
    // Durdur"a basan her şoför için, Firebase Console'da kalıcı olarak
    // birikmesi gereken bir anonim kullanıcı kalmıyor; sıradaki paylaşımda
    // (tekrar "Paylaşımı Başlat"a basılınca) zaten yeni bir anonim hesap
    // oluşturuluyor.
    //
    // NOT: Bu sadece kullanıcı düğmeye BASARAK paylaşımı durdurduğunda
    // çalışır. Sekmeyi/tarayıcıyı kapatıp hiç durdurmadan terk eden bir
    // şoförün anonim hesabı (bilerek kaldırılan "beforeunload" dinleyicisi
    // yüzünden, bkz. yukarıdaki not) burada silinemez — bu durumlar için
    // Firebase Console'dan periyodik temizlik hâlâ gerekebilir.
    Promise.all([tripDone, activeDone]).then(function () {
      return deleteAnonymousUser();
    }).catch(function () {}).then(function () {
      setStatus(remote ? "Paylaşım hane tarafından durduruldu." : "Paylaşım durduruldu.", remote ? "err" : "wait");
    });
  }

  function deleteAnonymousUser() {
    var u = auth.currentUser;
    if (!u || !u.isAnonymous) return Promise.resolve();
    return u.delete().catch(function (err) {
      // Silme başarısız olsa bile (ör. anlık ağ sorunu) kritik değil —
      // hesap Firebase Console'dan elle temizlenebilir, paylaşım akışını
      // etkilemez.
      console.warn("anonim hesap silinemedi:", err);
    });
  }

  // NOT: Daha önce burada "beforeunload" (sekme/tarayıcı kapanırken)
  // active:false yazan bir dinleyici vardı. Bu KALDIRILDI — çünkü mobil
  // tarayıcılarda bu olay, şoför sadece uygulamayı değiştirdiğinde veya
  // telefonu kilitlediğinde de tetiklenebiliyor; bu da paylaşımı hiç
  // durdurmamışken "⚪ pasif" görünmesine yol açıyordu. Artık paylaşım
  // SADECE şoför "Paylaşımı Durdur" butonuna elle bastığında (stopSharing)
  // durduruluyor. Gerçekten terk edilmiş/bağlantısı kopmuş paylaşımlar,
  // hane tarafındaki 3 dakikalık "son güncelleme" eşiği ile zaten otomatik
  // olarak pasif gösteriliyor — updatedAt alanı üzerinden, active bayrağına
  // gerek kalmadan.
})();
</script>
</body>
</html>
